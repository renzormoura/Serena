name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # OCR: Tesseract do sistema + modelo de português, para os testes de leitura de imagem rodarem aqui também.
      - name: Instalar Tesseract
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          mkdir -p .tessdata
          curl -sSL -o .tessdata/por.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata
      # O runner do GitHub tem Docker: os testes de integração com Testcontainers rodam aqui.
      - run: sh mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Os tipos TS precisam estar em dia com docs/api/openapi.json (o backend garante que o contrato está atualizado).
      - run: npm run api:tipos && git diff --exit-code src/api/esquema.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
